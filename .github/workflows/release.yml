name: Publish Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION_TYPE: ${{ github.event.release.prerelease && 'beta' || 'release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read gradle.properties
        id: properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod_id mod_name java_version minecraft_version modrinth_id curseforge_id'

      - name: Set up Java ${{ steps.properties.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ steps.properties.outputs.java_version }}

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --console=plain

      - name: Locate artifacts
        id: artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          EXCLUDE='-sources\.jar$|-dev-shadow\.jar$|-dev\.jar$'
          FABRIC=$(ls -t fabric/build/libs/*.jar | grep -Ev "$EXCLUDE" | head -n 1)
          NEOFORGE=$(ls -t neoforge/build/libs/*.jar | grep -Ev "$EXCLUDE" | head -n 1)
          {
            echo "version=$VERSION"
            echo "fabric=$FABRIC"
            echo "neoforge=$NEOFORGE"
          } >> "$GITHUB_OUTPUT"
          echo "Version:  $VERSION"
          echo "Fabric:   $FABRIC"
          echo "NeoForge: $NEOFORGE"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.properties.outputs.mod_name }}-${{ steps.artifacts.outputs.version }}"
          path: |
            ${{ steps.artifacts.outputs.fabric }}
            ${{ steps.artifacts.outputs.neoforge }}

      - name: Attach files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.fabric }}
            ${{ steps.artifacts.outputs.neoforge }}

      - name: Publish to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        continue-on-error: true
        with:
          name: "${{ steps.properties.outputs.mod_name }} ${{ steps.artifacts.outputs.version }}"
          version: ${{ steps.artifacts.outputs.version }}
          version-type: ${{ env.VERSION_TYPE }}
          changelog: ${{ github.event.release.body }}
          game-versions: ${{ steps.properties.outputs.minecraft_version }}
          loaders: fabric,neoforge
          java: ${{ steps.properties.outputs.java_version }}
          fail-mode: skip

          modrinth-id: ${{ steps.properties.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true

          curseforge-id: ${{ steps.properties.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            ${{ steps.artifacts.outputs.fabric }}
            ${{ steps.artifacts.outputs.neoforge }}
